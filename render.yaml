# Render Blueprint for the FinSight API (the UI is on Vercel).
# One-click deploy: https://render.com/deploy?repo=https://github.com/rahuldabola/finsight-rag
services:
  - type: web
    name: finsight-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secrets: prompted for in the Render dashboard, never committed.
      - key: GEMINI_API_KEY
        sync: false
      - key: FINSIGHT_ADMIN_PASSWORD # upload password; empty disables uploads
        sync: false
      - key: FINSIGHT_CORS_ORIGINS
        value: https://finsight-ai-rag.vercel.app
      # Free instances get a fractional CPU; more ONNX threads than cores only adds contention.
      - key: FINSIGHT_ONNX_THREADS
        value: "1"
      # Free instances have 512 MB. With ONNX's memory arena and 4-passage rerank batches,
      # a reranked search peaked at ~565 MB and the instance was killed; with these two
      # it peaks at ~420 MB (measured locally), and reranking got faster on one thread.
      # The free instance's fractional CPU made the cross-encoder take ~9 s per question.
      # Without it retrieval is ~0.1 s; eval Recall@8 0.961 -> 0.922 (hybrid + filters).
      # Set to "1" on a host with real CPU. Search requests can still ask for rerank: true.
      - key: FINSIGHT_RERANK
        value: "0"
      - key: FINSIGHT_ONNX_ARENA
        value: "0"
      - key: FINSIGHT_RERANK_BATCH
        value: "1"
      # Free instances have an ephemeral disk: uploaded PDFs reset on each deploy or
      # restart, and the seed corpus baked into the image is restored on boot.
