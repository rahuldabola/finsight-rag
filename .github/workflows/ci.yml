name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - name: Tests (fail under 85% coverage)
        run: pytest
      - name: Eval labels match the source PDFs
        run: python -m eval.check_labels

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  retrieval-regression:
    # Real embedding model + real seed index: fails if Recall@8 falls below the published baseline.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - run: python -m eval.regression

  e2e:
    # Real browser against the production build; the API is mocked at the network layer.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    # Builds the production image via docker-compose, waits for its healthcheck and queries the running container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: API answers from inside the container
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/health | tee health.json
          jq -e '.status == "ok" and .documents == 8 and .chunks > 3000' health.json
          curl --fail --silent --show-error -X POST http://localhost:8000/api/search             -H 'Content-Type: application/json'             -d '{"question": "What were Infosys revenues in Q1 FY27?", "rerank": false}'             | jq -e '.companies == ["Infosys"] and any(.hits[]; .text | contains("5,082"))'
      - if: failure()
        run: docker compose logs --no-color api
      - if: always()
        run: docker compose down --volumes

