name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - name: Tests (fail under 85% coverage)
        run: pytest
      - name: Eval labels match the source PDFs
        run: python -m eval.check_labels

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  retrieval-regression:
    # Real embedding model + real seed index: fails if Recall@8 falls below the published baseline.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - run: python -m eval.regression
