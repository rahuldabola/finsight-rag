name: Live smoke test

# Checks the real deployment end to end without calling the LLM (so it costs no Gemini quota):
# frontend up, API healthy with the full corpus, and real retrieval returns the right evidence.
# A failure here means the live demo linked from the README is broken.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  API: https://finsight-api-production-1220.up.railway.app
  WEB: https://finsight-ai-rag.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Frontend is up
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --output /dev/null "$WEB"

      - name: API is healthy and serves the full corpus
        run: |
          # --retry-all-errors: an idle Railway container can take a while to wake.
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors "$API/api/health" | tee health.json
          jq -e '.status == "ok" and .documents == 8 and .chunks > 3000' health.json

      - name: Retrieval returns the Infosys Q1 revenue table
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 -X POST "$API/api/search" \
            -H 'Content-Type: application/json' \
            -d '{"question": "What were Infosys revenues in Q1 FY27?", "rerank": false}' | tee search.json > /dev/null
          jq -e '.companies == ["Infosys"] and (.hits | length) > 0 and any(.hits[]; .text | contains("5,082"))' search.json

      - name: Published evaluation results are served
        run: |
          curl --fail --silent --show-error --retry 3 "$API/api/eval" | jq -e '.retrieval | length == 5'
